services:
  auroramihomo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: auroramihomo:latest
    container_name: auroramihomo
    restart: unless-stopped
    # 透明代理/TUN 需要 host 网络
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    # 镜像默认以非 root 账户 aurora(10001) 运行，宿主机数据目录需匹配属主：
    #   mkdir -p data && sudo chown -R 10001:10001 data
    #
    # 重要：cap_add 只把 NET_ADMIN 加入容器的 bounding set，非 root 进程
    # 默认不会获得该能力的 effective 位。因此若要使用 mihomo 的 TUN 模式，
    # 需取消下面两行注释以 root 运行（代价是失去非 root 隔离）：
    #   user: "0:0"
    # 仅用 HTTP/SOCKS/混合端口代理时保持默认的非 root 即可。
    #
    # TUN 模式还需把宿主的 tun 设备映射进来——容器默认没有任何设备访问权。
    # 缺设备与缺 capability 的症状不同：界面上的环境检测会分别报
    # 「TUN 设备未找到」与「NET_ADMIN 已授予但当前进程未持有」，据此对照排查。
    #   devices:
    #     - /dev/net/tun:/dev/net/tun
    security_opt:
      # 禁止通过 setuid 程序提权，缩小容器逃逸面。
      # 注意：该选项会阻断基于文件 capability 的提权，与 TUN 模式互斥。
      - no-new-privileges:true
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      # 生产环境建议显式设置，避免依赖数据库中自动生成的密钥
      # - AURORA_JWT_SECRET=请替换为足够随机的长字符串
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8899/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 限制日志体积，避免长期运行撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

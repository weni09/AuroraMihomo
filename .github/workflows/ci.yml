name: CI

# 本 workflow 不自己监听 push：日常推送分支不消耗 Actions 额度。
#
# 实际入口有两个：
#   1. workflow_call —— 由 release.yml 在打 tag 后作为前置门禁调用，
#      从而保证「CI 全绿才构建发布产物」。这里刻意不写 push.tags：
#      release.yml 已经监听了同样的 tag，两边都写会让推一个 tag 触发
#      两次完整 CI（一次独立、一次被调用），既费额度又让状态列表混乱。
#   2. workflow_dispatch —— 手动入口，想在打 tag 前先验一遍时用，
#      不必为此制造一个废弃 tag。
on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # 直接读 go.mod，避免与其中声明的版本不一致导致编译器拒绝构建
          go-version-file: go.mod
          cache: true

      - name: 检查代码格式
        run: |
          files=$(gofmt -l ./backend)
          if [ -n "$files" ]; then
            echo "以下文件未格式化："
            echo "$files"
            exit 1
          fi

      - name: 静态检查 (go vet)
        run: go vet ./backend/...

      # go vet 不检查被丢弃的错误返回值，此前 service/repository 层因此
      # 长期存在静默吞掉写库失败的代码。errcheck 等检查由 golangci-lint 覆盖。
      #
      # 用官方安装脚本 + 直接调 CLI，不走 golangci-lint-action：
      # 该 action 把「下载、校验版本、执行」包在一起，任何一环出错都只报
      # 一句失败，日志里看不出是环境问题还是代码问题。本项目曾因此连续三次
      # 发布失败——真因是 lint 二进制与 Go 工具链的版本错配（见下），
      # 但 action 只报"静态检查失败"，极易误判成自家代码有 lint 问题。
      # 直接调 CLI 则版本、参数与 panic 栈全部落在日志里。
      #
      # 版本必须固定且不能低于构建它的 Go 版本所能解析的语言版本：
      # golangci-lint 二进制内嵌 go/types，只能分析「不高于自身构建 Go 版本」
      # 的代码。v2.6.2 用 go1.25 构建，遇到 Go 1.26 的标准库会直接
      # panic: file requires newer Go version go1.26。而 setup-go 读 go.mod 时
      # 把 `go 1.25.0` 当下限、实际装最新的 1.26.x，于是必然踩中。
      # v2.11.4 用 go1.26.1 构建，已验证在 1.25 与 1.26 工具链下均为 0 issues。
      # 同理不用 latest：lint 规则集随版本变化，浮动版本会让同一份代码
      # 在不同时间得到不同结论。
      - name: 安装 golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
          "$(go env GOPATH)/bin/golangci-lint" --version

      - name: 静态检查 (golangci-lint)
        run: "$(go env GOPATH)/bin/golangci-lint run --timeout=5m ./backend/..."

      - name: 构建
        run: go build -v ./backend/api

      - name: 测试（含竞态检测）
        run: go test -race -cover ./backend/...

  conventions:
    name: 开发规范校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 校验 AGENTS.md / backend/AGENTS.md / frontend/AGENTS.md 中可机检的条款：
      # SQL 分层、goctl 生成物完好、logic 层日志用法、前端主题 token、skill 路径。
      # 存量违规记录在 scripts/conventions-baseline.txt，只拦新增。
      - name: 校验开发规范
        run: python scripts/check-conventions.py --baseline scripts/conventions-baseline.txt

  frontend:
    name: 前端构建与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      # 前端内置的使用文档是 userdocs/ 下原件的副本（为何用复制而非跨目录
      # import 见 scripts/sync-docs.mjs 的注释）。改了原件忘同步，
      # 面板里显示的就会是旧文档，这里兜住。
      - name: 校验内置文档与 userdocs/ 一致
        run: node scripts/sync-docs.mjs --check

      - name: 类型检查
        working-directory: frontend
        run: npx vue-tsc --noEmit -p tsconfig.app.json

      # 此前 CI 未跑 lint，导致「禁止 any」等规范从未被强制，
      # 积累了 87 处违规。存量已冻结在 eslint-suppressions.json，
      # 新增的 any 会在此处失败。修完存量后用
      # `npx eslint . --prune-suppressions` 收紧该文件。
      - name: 代码规范检查 (eslint)
        working-directory: frontend
        run: npx eslint . --no-fix

      # 回归测试，重点覆盖两类曾导致数据丢失的路径（配置被空值覆盖、
      # 编辑器空文本清空高级参数）与弹窗/提示的无障碍行为。
      - name: 单元测试
        working-directory: frontend
        run: npm test

      - name: 构建
        working-directory: frontend
        run: npm run build

  docker:
    name: 多架构镜像构建验证
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      # 只构建不推送，确保 Dockerfile 在两种架构下都能编译通过
      - name: 构建 amd64 / arm64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Release

# 打 v* 标签时构建多平台二进制并发布到 Release。
# 也支持手动触发，便于在正式打标签前验证产物。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（手动触发时使用，如 v0.1.0-test）"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # 前端产物与平台无关，构建一次给所有平台复用
      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: public

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # SQLite 驱动是纯 Go 的（github.com/libtnb/sqlite → modernc.org/sqlite），
      # 因此 CGO_ENABLED=0 即可全平台交叉编译，不需要任何 C 工具链，
      # 也不需要按 libc 区分 musl / glibc —— 静态产物在 Alpine 与
      # Debian/Ubuntu 上通用。
      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-w -s" -o "auroramihomo${{ matrix.ext }}" ./backend/api

      - name: 打包
        run: |
          version="${GITHUB_REF_NAME:-${{ inputs.version }}}"
          name="auroramihomo_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name/etc"
          cp "auroramihomo${{ matrix.ext }}" "dist/$name/"
          cp -r public "dist/$name/public"
          cp backend/api/etc/aurora-api.yaml "dist/$name/etc/"
          cp README.md "dist/$name/" 2>/dev/null || true
          # Windows 用 zip（解压后保留不了执行位也无所谓），其余用 tar.gz
          if [ "${{ matrix.goos }}" = windows ]; then
            (cd dist && zip -qr "$name.zip" "$name")
            (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 5

  release:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    # 手动触发只验证构建，不创建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: 汇总校验和
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 安装

            在线安装（Linux / macOS，把 OWNER 换成实际仓库）：

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh \
              | sudo sh -s -- --repo ${{ github.repository }}
            ```

            离线安装：下载对应平台的包，解压后运行
            `./auroramihomo -f etc/aurora-api.yaml`。

            二进制为纯静态产物（不依赖 CGO），Alpine 与 Debian/Ubuntu 通用。

            包内不含 mihomo 内核，首次启动时会自动下载；
            完全离线的环境需手工放置到 `data/bin/mihomo`，
            详见 `docs/AuroraMihomo-Deployment-Design.md`。

            透明代理需要 `CAP_NET_ADMIN`，见
            `docs/AuroraMihomo-Transparent-Proxy.md`。

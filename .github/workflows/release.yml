name: Release

# 只在手动打 tag 并 push 后触发：
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# 流程是 CI 全绿 → 构建五平台二进制 → 创建 Release。
# 也支持手动触发，用于在正式打 tag 前验证产物（此时不会创建 Release）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（手动触发时使用，如 v0.1.0-test）"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write
  packages: write

jobs:
  # 先跑一遍完整 CI（测试、lint、类型检查、镜像构建验证）。
  # 用 workflow_call 复用 ci.yml 而不是复制一份检查步骤：
  # 两份迟早会漂移，而且那时 release 放过的问题正是最不该放过的。
  ci:
    name: 质量门禁
    uses: ./.github/workflows/ci.yml

  frontend:
    name: 构建前端
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # 前端产物与平台无关，构建一次给所有平台复用
      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: public

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # SQLite 驱动是纯 Go 的（github.com/libtnb/sqlite → modernc.org/sqlite），
      # 因此 CGO_ENABLED=0 即可全平台交叉编译，不需要任何 C 工具链，
      # 也不需要按 libc 区分 musl / glibc —— 静态产物在 Alpine 与
      # Debian/Ubuntu 上通用。
      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-w -s" -o "auroramihomo${{ matrix.ext }}" ./backend/api

      - name: 打包
        env:
          # 按事件类型取版本号，不能写 ${GITHUB_REF_NAME:-inputs.version}：
          # 手动触发时 GITHUB_REF_NAME 是分支名（main）而非空值，
          # 那个默认值永远不会生效，包名会变成 auroramihomo_main_xxx。
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          version="$VERSION"
          name="auroramihomo_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name/etc"
          cp "auroramihomo${{ matrix.ext }}" "dist/$name/"
          cp -r public "dist/$name/public"
          cp backend/api/etc/aurora-api.yaml "dist/$name/etc/"
          cp README.md "dist/$name/" 2>/dev/null || true
          # Windows 用 zip（解压后保留不了执行位也无所谓），其余用 tar.gz
          if [ "${{ matrix.goos }}" = windows ]; then
            (cd dist && zip -qr "$name.zip" "$name")
            (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 5

  docker:
    name: 构建并推送 Docker 镜像
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 发布 Release
    needs: [build, docker]
    runs-on: ubuntu-latest
    # 手动触发只验证构建，不创建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: 汇总校验和
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 安装与运行

            ### Docker 镜像

            ```bash
            docker run -d \
              --name auroramihomo \
              --restart unless-stopped \
              --network host \
              --cap-add NET_ADMIN \
              -v ./data:/data \
              ghcr.io/${{ github.repository }}:${{ github.event_name == 'push' && github.ref_name || inputs.version }}
            ```

            ### 在线安装（Linux / macOS）

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh \
              | sudo sh -s -- --repo ${{ github.repository }}
            ```

            一条命令装完即可访问，Debian/Ubuntu（systemd）与 Alpine（OpenRC）
            都是：脚本会校验 sha256、补齐透明代理依赖、装对应的服务单元、
            启用开机自启并启动。升级重跑同一条命令，保留现有配置。

            加 `--dry-run` 先只打印将要执行的动作；`--no-deps` /
            `--no-service` / `--no-start` 分别关掉依赖补齐、服务单元与自动启动。

            离线安装：下载对应平台的包，解压后运行
            `./auroramihomo -f etc/aurora-api.yaml`。

            二进制为纯静态产物（不依赖 CGO），Alpine 与 Debian/Ubuntu 通用。

            包内不含 mihomo 内核，首次启动时会自动下载；
            完全离线的环境需手工放置到 `data/bin/mihomo`，
            详见 `docs/AuroraMihomo-Deployment-Design.md`。

            透明代理需要 `CAP_NET_ADMIN`，见
            `docs/AuroraMihomo-Transparent-Proxy.md`。

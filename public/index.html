<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <!-- SVG 优先（矢量、任意缩放不失真），ico 留作老浏览器回退 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <meta name="description" content="AuroraMihomo — Mihomo 内核管理面板，支持订阅合并、冲突处理与内置控制面板">
    <title>AuroraMihomo 管理面板</title>
    <!--
      主题必须在样式表解析前同步落定，否则深色偏好下首屏会闪一下白底。
      因此这里是内联同步脚本，不能挪进 main.ts（那已经是 defer 之后执行）。
      与 src/composables/useTheme.ts 共用 localStorage 键名 aurora_theme。
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('aurora_theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f8fafc')
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，此时按浅色渲染即可 */
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-CTvQeDtZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DbjhEVas.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

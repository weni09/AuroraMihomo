# golangci-lint 配置（v2 schema，需 golangci-lint v2.x）
#
# 引入动机：此前 CI 只跑 go vet，而 go vet 不检查被丢弃的错误返回值，
# 导致 service/repository 层长期存在静默吞掉写库失败的代码
# （订阅错误状态写不进去也无人知晓）。errcheck 能从根上拦住这类问题。
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck      # 未处理的错误返回值
    - govet         # 与 go vet 等价
    - ineffassign   # 无效赋值
    - staticcheck   # 静态分析（v2 中已合并 gosimple/stylecheck）
    - unused        # 未使用的标识符
    - bodyclose     # HTTP 响应体未关闭（会泄漏连接）
    - noctx         # 缺少 context 的 HTTP 请求
    - errorlint     # 错误比较/包装用法
    - misspell      # 常见拼写错误

  settings:
    errcheck:
      # 显式忽略这些「失败也无补救动作」的调用，避免噪音淹没真问题。
      # 注意：数据库写入不在此列——那些必须处理或至少记日志。
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        # ST1000/ST1003/ST1020/ST1021/ST1022：包与导出符号的英文注释规范。
        # 本项目注释以中文为主，这些检查只会产生与实际质量无关的噪音。
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
        # SA5008: 误报。go-zero 复用 `json:` tag 承载自己的 optional/default=
        # 选项（由 go-zero 的 mapping 包解析，而非 encoding/json），
        # staticcheck 不认识这套方言，会把全部请求结构体标为非法。
        - -SA5008

  exclusions:
    generated: lax
    rules:
      # goctl 生成的代码不属于手写范围
      - path: backend/api/internal/(types|handler)/
        linters:
          - errcheck
          - unused
      # 测试里为可读性常忽略清理类错误；
      # noctx 对测试内的 http.Get/Post 无实际意义（测试自带超时与生命周期）
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

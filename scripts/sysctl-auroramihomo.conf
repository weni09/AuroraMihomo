# 由 AuroraMihomo 安装/部署写入，用于透明代理与网关/旁路由（硬依赖相关）。
# 与 backend/internal/netcheck/provision.go 写入的键保持一致。
# 面板「自动准备环境」也会维护 /etc/sysctl.d/99-auroramihomo.conf（只写不合规项）。
# 不再需要时可删除本文件后执行 sysctl --system（BusyBox 用 sysctl -p <其它 drop-in>）。
#
# TCP BBR / fq 是可选性能优化，见同目录 sysctl-auroramihomo-bbr.conf，
# 不要与本文件合并——内核不支持 BBR 时不应拖累转发参数加载。

# 作为局域网网关转发其它设备的 IPv4 流量
net.ipv4.ip_forward = 1

# 作为局域网网关/旁路由转发其它设备的 IPv6 流量
net.ipv6.conf.all.forwarding = 1

# 严格反向路径校验会丢弃 TProxy 打标后回环的包；2=宽松（与 Debian/Ubuntu 默认一致）
net.ipv4.conf.all.rp_filter = 2

# 新建网卡的默认值，否则后出现的网卡仍是严格模式
net.ipv4.conf.default.rp_filter = 2

# 由 AuroraMihomo 安装/部署写入（可选性能优化，非透明代理硬依赖）。
# 与必需项 99-auroramihomo.conf（转发 / rp_filter）刻意分开：
# 内核不支持 bbr/fq 时，不应拖累网关参数的加载。
#
# 启用前请确认：
#   cat /proc/sys/net/ipv4/tcp_available_congestion_control   # 应含 bbr
#   # 若无 bbr：modprobe tcp_bbr 后再试
#
# 安装脚本会 best-effort 检测；不支持则跳过且不留会失败的 drop-in。
# 手工启用：
#   cp scripts/sysctl-auroramihomo-bbr.conf /etc/sysctl.d/99-auroramihomo-bbr.conf
#   sysctl -p /etc/sysctl.d/99-auroramihomo-bbr.conf

# 与 BBR 搭配的默认排队规则
net.core.default_qdisc = fq

# TCP 拥塞控制：BBR（影响整机出站 TCP，不单是代理流量）
net.ipv4.tcp_congestion_control = bbr
